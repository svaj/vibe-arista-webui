hostname acl-lab
!
vlan 40
   name L3-ACL-TEST
!
interface Vlan40
   ip address 10.40.0.1/24
!
ip access-list standard ADMIN-STD
   10 permit host 10.10.0.7 log
   20 permit 10.20.0.0 0.0.255.255
   30 deny any
!
ip access-list SNMP-EXT
   no statistics per-entry
   10 permit tcp host 10.10.0.5 eq 161 host 10.40.0.1 log
   20 permit udp 172.16.4.0/24 neq snmp host 172.16.9.9 lt 1024 fragments
   30 permit icmp 192.168.0.0/16 any ttl eq 1 tracked
   40 permit ip any any
!
ip access-list standard EMPTY-STD
!
end
