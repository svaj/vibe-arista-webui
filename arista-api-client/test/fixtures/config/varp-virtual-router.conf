hostname varp-lab
!
ip virtual-router mac-address 00:1b:1b:00:00:01
!
vlan 10
   name VARP-A
!
vlan 20
   name VARP-B
!
vlan 30
   name VARP-C
!
interface Vlan10
   ip address 10.10.0.1/24
   ip virtual-router address 10.10.0.254
!
interface Vlan20
   ip address 10.20.0.1/24
   ip virtual-router address 10.20.0.254
   ip virtual-router address 10.20.0.253
!
interface Vlan30
   no ip address
!
interface Ethernet1
   no switchport
   ip address 10.99.0.1/30
   ip virtual-router address 10.99.0.2
!
end
