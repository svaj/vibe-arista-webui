router bgp 43902
   router-id 1.1.1.1
   maximum-paths 4 ecmp 4
   neighbor LEAF peer-group
   neighbor 10.0.0.1 peer-group LEAF
   address-family ipv4
      neighbor LEAF activate
      network 192.0.2.0/24
   !
   vrf TENANT
      rd 1:1
      route-target import 10.10:100
      address-family ipv4
         neighbor 172.16.0.1 activate
      !
   !
!
