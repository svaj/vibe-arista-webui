name: CI

# Offline quality gate for every push and pull_request (#2 / M0). **The rule that must never
# weaken: a push/PR job must never start, build or contact an EOS device or a cEOS-lab container —
# no image, no docker, no eAPI endpoint.** The M12 (#14) real-EOS lane exists exactly as this header
# always reserved it: separate, explicitly trusted `workflow_dispatch` **jobs** (`ceos-live` and the
# #142 `ceos-e2e` browser lane below, one per dispatch chosen by the `lane` input) on a dedicated
# self-hosted runner per docs/CEOS.md. Neither can be reached by a push, a PR (including
# a fork PR) or a scheduled run, and they are the only jobs in this file allowed to create a
# container — everything else in this file stays offline by construction.

on:
  push:
    branches: [main]
  pull_request:
  # Trusted operators only. Docs/CEOS.md §Browser E2E and CI plan item 5: "Initially use explicit
  # trusted workflow_dispatch on a dedicated Linux runner with authorized image access. Keep ordinary
  # PR checks offline." Never combine this with an `image:` job or a secret for the live lane.
  workflow_dispatch:
    inputs:
      port:
        description: 'Loopback port the lab publishes (must be free on the lab runner)'
        required: false
        default: '8443'
      # #142: the dispatch picks WHICH trusted lane runs. Both lanes provision their own run-owned
      # cEOS container; neither may ever run on a push/PR event.
      lane:
        description: 'Trusted lab lane to run'
        required: false
        default: 'live'
        type: choice
        options:
          - live
          - e2e

permissions:
  contents: read

concurrency:
  # Push/PR behaviour is unchanged: a superseded duplicate of the same ref is cancelled.
  # A trusted dispatch gets its OWN lane keyed on the endpoint, never cancelled mid-flight, because
  # it holds a privileged container, a lab credential set and possibly an open config session — the
  # docs/CEOS.md "single-flight execution per endpoint" rule, at the scheduler level. Second
  # dispatch on the same port QUEUES behind the first. The harness layers a second, machine-local
  # guard (scripts/.state/lock-<port>.json, stale-aware), so a run smuggled past the scheduler still
  # refuses with exit 4 — that guard is also what keeps a live-lane dispatch and an e2e-lane dispatch
  # on the SAME port from touching one endpoint at once, now that the group key carries the lane
  # (#142). Before the e2e lane existed this group was `ceos-live-endpoint-<port>`; the default
  # lane ('live') reproduces that exact string, so in-flight live queues were never re-keyed.
  # If a second lab runner is ever added, put its name in this group too.
  group: ${{ github.event_name == 'workflow_dispatch' && format('ceos-{0}-endpoint-{1}', github.event.inputs.lane || 'live', github.event.inputs.port || '8443') || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: typecheck / lint / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # PLAN.md M0 asked for a Node 20/22 matrix. The repo's existing toolchain forbids 20:
      #   vitest 5.0.5 engines: "^22.12.0 || ^24.0.0 || >=26.0.0"
      #   jsdom 30.1.3  engines: "^22.22.2 || ^24.15.0 || >=26.0.0" (its undici@8 needs node >=22.19)
      # so a node-20 job dies inside `vitest run` for arista-webui (undici decompress.js:
      # "Cannot read properties of undefined (reading 'bind')"), not because of this package.
      # 22 + 24 are the two LTS lines every pinned tool supports. The library's own
      # `engines.node >= 20` (DR-021) is a runtime floor claim, not a dev-toolchain claim:
      # proved in M12 (#14) by the `dist-node20` job below, which runs the built dist/ under Node 20
      # with the dependency-free `scripts/dist-smoke.mjs` instead of running the dev tooling there.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (lockfile at the workspace root)
        run: npm ci

      # Order deliberately mirrors the local exit gate from PLAN.md M0.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (offline only — never a device)
        run: npm test

      # The v8 coverage gate. `arista-api-client/vitest.config.ts` carries the global floor
      # (lines 85 / branches 75 / functions 60) plus the per-directory thresholds, and the
      # command's EXIT CODE is the assertion — a threshold miss fails this step. Still fully
      # offline: the `unit` project excludes every `*.live.test.ts`, nothing here can reach a
      # device or Docker. Cheaper than it looks (~6 s of wall time), so it gates both legs;
      # only the node-22 leg publishes the report, so there is one artifact to review.
      - name: Coverage gate (offline unit suite)
        run: npm run coverage -w arista-api-client

      # Same gate for the UI workspace (#69): thresholds live in
      # `arista-webui/vitest.config.ts` (global floor + per-directory floors, all AT the measured
      # baseline of the F7 branch — recorded in that PR's body), the exit code is the assertion, and
      # the suite stays offline/jsdom. Floors may only ratchet UP as screens land (each screen issue
      # raises its dir); a directory that erodes fails the leg — the client's "green suite, silent
      # gap" prevention, mirrored.
      - name: Coverage gate (webui, jsdom unit suite)
        run: npm run coverage -w arista-webui

      - name: Build
        run: npm run build

      # Uploaded with !cancelled() so a threshold failure still ships the report the reviewer
      # needs to see WHAT was uncovered — the step's own failure above is the gate.
      - name: Upload coverage report (node 22 leg only)
        if: ${{ matrix.node == '22' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-client-coverage-node${{ matrix.node }}
          path: arista-api-client/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Upload webui coverage report (node 22 leg only)
        if: ${{ matrix.node == '22' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: webui-coverage-node${{ matrix.node }}
          path: arista-webui/coverage/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------- engines.node >= 20 (DR-021), proved on the artifact ---------
  # Still a PR-safe, offline job: no image, no Docker, no endpoint. `scripts/dist-smoke.mjs` installs
  # no dependencies of its own and replaces fetch/http(s).request with a throwing tripwire before it
  # imports `dist/`, so the only thing exercised is the shipped bundle loading and behaving.
  # The floor cannot be measured by the suite: vitest 5.0.5 and jsdom 30 exclude Node 20 outright (see
  # the matrix note), which is what the note reserved this leg for. `npm run build` is the only dev
  # tooling that runs here, and vite/oxlint/rolldown/plugin-react all accept `^20.19.0`, which is the
  # patch line actions/setup-node installs for `node-version: 20` — so the build is a fixture of this
  # job, not its subject. A Node that is older than the package's own floor makes the script exit 1
  # rather than pass vacuously, so this leg cannot silently stop proving anything.
  dist-node20:
    name: dist smoke on the engines floor (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (lockfile at the workspace root)
        run: npm ci

      - name: Build the libraries
        run: npm run build

      - name: Smoke the built dist/ (no dev tooling, no device, no network)
        run: node scripts/dist-smoke.mjs

  # ================== cEOS-lab live eAPI lane — trusted dispatch only (M12b #14) ============
  # How this composes with `arista-api-client/src/testing/live-guard.ts` (the consent matrix):
  # the guard is the ONLY thing in front of a `*.live.test.ts`, and it needs a set of independent
  # consents, none of which this job fabricates. `npm run lab:run` (scripts/ceos-lab.mjs) supplies
  # them from a container it created and owns: loopback `EAPI_HOST` + the published `EAPI_PORT`
  # (also handed to `EAPI_ALLOW_PORTS`, because the guard's default list only carries 8443 and this
  # job pins 8443 anyway), `EAPI_TARGET_CLASS=lab`, run-scoped `EAPI_USER`/`EAPI_PASS`, the probed
  # `EAPI_ALLOW_MODEL` (a cEOS model — the guard rejects the hardware model name here), the pinned
  # `EAPI_ALLOW_VERSION=4.28.14M`, `EAPI_CA_FILE` pointing at the run's extracted **public**
  # certificate, and one `EAPI_SCRATCH_INTERFACE`. The harness refuses before any of that if
  # `EAPI_TARGET_CLASS` is anything but `lab` or an inherited `EAPI_HOST` is not loopback (exit 3),
  # and the image-identity pin (exit 5) means an unauthorized/mismatched image never starts. No
  # secret is stored in this workflow: there are no `secrets.*` references anywhere in this job, and
  # the credential exists only in the per-run 0600 state file plus the child env, deleted on
  # teardown. Local opt-in leniency (DR-034: skip-with-a-reason, exit 0) is deliberately NOT
  # reproduced here — `scripts/assert-live-run.mjs` fails the job when nothing executed.
  #
  # Why it cannot run by accident: `runs-on` names labels GitHub never hosts, so the job is queued
  # until a runner registered on the trusted lab machine (docs/CEOS.md §Manual lab setup, "dedicated
  # trusted lab host/runner") picks it up — which also means the job is currently UNEXECUTED and the
  # image must already be imported there as an authorized local cache (the harness never pulls).
  # Nothing may be published from it: `--no-fixtures` keeps committed captures out of reach of CI
  # (refresh is `npm run fixtures:refresh -- --yes`, a human act by docs/CEOS.md "explicit and
  # reviewed"), and the only artifact is a log that has already passed the secret scan.
  ceos-live:
    name: cEOS-lab live eAPI suite (trusted dispatch, self-hosted lab runner)
    # Belt and braces on top of the `workflow_dispatch` trigger: a fork PR, a push, or a copy of this
    # file reaching another event must never start a privileged container. The #142 `lane` input
    # picks between the two trusted lanes; an unset lane stays the live suite (exact prior behavior).
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.lane || 'live') == 'live' }}
    runs-on: [self-hosted, linux, eos-lab]
    timeout-minutes: 45
    env:
      LAB_PORT: ${{ github.event.inputs.port || '8443' }}
      LIVE_LOG: live-run.log
    steps:
      - uses: actions/checkout@v4

      # The live suite runs on vitest 5, so this leg needs a supported line (22), not the floor 20 —
      # that is exactly the `quality`/`dist-node20` split in this file.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (lockfile at the workspace root)
        run: npm ci

      - name: Preflight — what this harness already owns (read-only listing, nothing created)
        # Prints every labelled container/network plus the state/lock files, so an operator sees a
        # leftover run from an interrupted job BEFORE a new privileged container is started.
        run: npm run lab:list

      - name: Live suite against the run-owned lab (up → probe → vitest --project live → down)
        # `--quiet` keeps the one-time credential print out of the log that becomes an artifact; the
        # 0600 state file stays the only copy and the harness deletes it. `--no-fixtures` means this
        # job can never write a committed capture. pipefail keeps the harness's exit code, which is
        # either the child's exit code or a distinct refusal code (3-9).
        # No worker/file fan-out is configured here on purpose: the `live` project in
        # arista-api-client/vitest.config.ts already pins pool 'forks' + fileParallelism:false +
        # maxWorkers:1, which is the in-process half of docs/CEOS.md's "single-flight execution per
        # endpoint, both between jobs and within Vitest/Playwright".
        run: |
          set -o pipefail
          # `--exclude src/hw-*` keeps the HARDWARE capture runners (src/hw-inventory.live.test.ts,
          # src/hw-session-probe.live.test.ts — DR-124/DR-125) out of this lane entirely: they need a
          # supervised switch session under `EAPI_TARGET_CLASS=hardware` consent that no CI job can hold,
          # and left in place they land as 2 SKIPPED files — which `assert-live-run` forbids by design
          # (in the lab lane a skip means something went wrong). Excluded instead of skipped keeps the
          # zero-skip rule mechanical: every live test this job CAN run must EXECUTE and pass.
          # The child MUST run through the client workspace's own script: the `live` project is defined
          # in arista-api-client/vitest.config.ts, and `npx vitest run --project live` from the repo ROOT
          # fails config resolution outright (probed 2026-11-08 — this CI step had never been executed).
          npm run lab:run -- --quiet --no-fixtures --port "$LAB_PORT" -- \
            npm -w arista-api-client run test:live -- --exclude 'src/hw-*.live.test.ts' 2>&1 | tee "$LIVE_LOG"
        shell: bash

      - name: Teardown — always, including readiness/test/timeout failure paths
        # `lab:run` already tears its own run down in a finally (and on SIGINT/SIGTERM/SIGHUP). This
        # is the safety net for the paths where that never got to run: the job was cancelled or the
        # step was killed by timeout-minutes. It names this harness's newest run only, verifies the
        # run label before removing anything, never prunes shared resources, and is idempotent.
        if: ${{ always() }}
        run: npm run lab:down

      - name: Diagnostics — run ownership + the summary the assertion read
        if: ${{ always() }}
        run: |
          # `|| true`: the listing needs the daemon, and losing the summary lines below because of an
          # unreachable Docker socket would hide the actual reason this job failed.
          npm run lab:list || true
          if [ -f "$LIVE_LOG" ]; then
            grep -nE '^[[:space:]]+(Test Files|Tests)[[:space:]]' "$LIVE_LOG" || echo 'no vitest summary line in the log'
          else
            echo "$LIVE_LOG was never written — the live step died before the child produced output"
          fi
        shell: bash

      - name: Assert the live tests actually EXECUTED (all-skipped is not coverage)
        id: assert
        if: ${{ always() }}
        # The exit code of `vitest run --project live` cannot carry this signal: an unconsented or
        # half-guarded run exits 0 with everything skipped (DR-034's local convention). So this step
        # reads the printed summary itself — it fails unless a `Tests` line exists, zero tests are
        # skipped, zero failed, and >=1 passed — and it also runs the artifact hygiene scan, naming
        # any credential-shaped value it finds without echoing it.
        run: node scripts/assert-live-run.mjs "$LIVE_LOG" --min-passed 1 --check-secrets

      - name: Upload the redacted live log
        if: ${{ always() && steps.assert.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ceos-live-diagnostics-${{ github.run_id }}
          path: ${{ env.LIVE_LOG }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # #142 (docs/CEOS.md §Browser E2E and CI plan item 5): the trusted-dispatch half of the
  # B5 (#91) Playwright lane. Mirrors `ceos-live`'s guarantees exactly — dispatch-only,
  # self-hosted lab runner, `--quiet` (credentials exist only in the 0600 per-run state file the
  # harness deletes), `--no-fixtures` (this job can never write a committed capture), guaranteed
  # teardown on an always() path, and NO `secrets.*` anywhere. cEOS results are container
  # evidence only: a green run here never establishes 7050TX-64 / 4.28.13.1M support (DR-043).
  # ---------------------------------------------------------------------------
  ceos-e2e:
    name: cEOS-lab browser E2E (trusted dispatch, self-hosted lab runner)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'e2e' }}
    runs-on: [self-hosted, linux, eos-lab]
    timeout-minutes: 60
    concurrency:
      # The endpoint the lane dials is single-flight, and the lane additionally owns the fixed
      # dev-server ports 5173-5176 (scripts/e2e-run.mjs), so two e2e dispatches must never run
      # concurrently even on different LAB_PORT values — operators dispatching a second e2e lane
      # while one is in flight watch it QUEUE here. Never cancelled mid-flight: a killed lane
      # would orphan four vite servers and (worst case) a lab container the teardown step then
      # has to clean.
      group: ci-e2e-endpoint-${{ github.event.inputs.port || '8443' }}
      cancel-in-progress: false
    env:
      LAB_PORT: ${{ github.event.inputs.port || '8443' }}
      E2E_LOG: e2e-run.log
      # #142 blocker 2 (band determinism) resolution: on this WSL2 mirrored-mode host BOTH
      # route-verified bands proved intermittently poisoned mid-run — the B5 lane (2026-11-15)
      # watched 192.168.255.x and 172.31.x bridges pass `verifyMgmtBridgeRoute` and then fail
      # ARP, killing readiness with `mgmt-path-owned-by-host-nat` (exit 7); the green run landed
      # only after decoy networks forced the uncontested 10.177.x band. Route verification is
      # necessary but NOT sufficient under HNS, so this dispatch pins the band via the harness's
      # `--band`/CEOS_LAB_MGMT_BAND support (`npm run lab:mgmt-bands` previews what a pin
      # selects, read-only). A host that genuinely loses 10.177 too fails fast with the pin named
      # in the refusal instead of flaking — the correct CI posture is fix-the-host, not
      # random-band roulette.
      CEOS_LAB_MGMT_BAND: '10.177'
    steps:
      - uses: actions/checkout@v4

      # vitest 5 / vite 8 / jsdom 30 engine floors make Node 22 the minimum here, same split as
      # the `quality` (22/24) vs `dist-node20` jobs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (lockfile at the workspace root)
        run: npm ci

      # #142 blocker 1 (no provisioned Chromium) resolution. The runner host already carries the
      # revision this lockfile pins (chromium-1255 + headless shell + ffmpeg-1013 under
      # ~/.cache/ms-playwright, provisioned for the 2026-11-15 local B5 runs that went 10 passed /
      # 0 skipped), so this is normally a no-op — kept as a step so a wiped cache FAILS LOUDLY
      # here instead of dying inside the first spec with "Executable doesn't exist".
      - name: Browser — ensure the pinned Playwright Chromium (idempotent when cached)
        run: npx playwright install chromium

      - name: Preflight — what this harness already owns (read-only listing, nothing created)
        run: npm run lab:list

      - name: Browser E2E against the run-owned lab (up → probe → preflight + 4 dev states + Playwright → down)
        # The child (`scripts/e2e-run.mjs`) refuses any target that is not the loopback lab
        # endpoint, runs the TLS/identity preflight child, serves the four browser-observable
        # truth states (:5173 connected / :5174 unconfigured / :5175 unreachable / :5176 bad-auth,
        # a real 401 from cEOS), and owns the vite servers — credentials stay in the vite process
        # tree (F8: the browser never holds one; artifact traces/video/HAR are OFF, so everything
        # on disk is text and scannable). Playwright workers:1, retries:0. pipefail keeps the
        # harness exit code (child code or the 2-9 refusal classes).
        run: |
          set -o pipefail
          npm run lab:run -- --quiet --no-fixtures --port "$LAB_PORT" -- node scripts/e2e-run.mjs 2>&1 | tee "$E2E_LOG"
        shell: bash

      - name: Teardown — always, including readiness/test/timeout failure paths
        # Same safety net as ceos-live: `lab:run` tears its own run down in a finally and on
        # SIGINT/SIGTERM/SIGHUP; this catches the paths where that never got to run (job
        # cancelled, step killed by timeout-minutes). Run-labelled, verified, idempotent.
        if: ${{ always() }}
        run: npm run lab:down

      - name: Diagnostics — the summary the assertion read
        if: ${{ always() }}
        run: |
          if [ -f "$E2E_LOG" ]; then
            grep -nE '(passed|failed|flipped|skipped)' "$E2E_LOG" | tail -5 || echo 'no playwright summary line in the log'
          else
            echo "$E2E_LOG was never written — the lane died before the child produced output"
          fi
          if [ -f arista-webui/e2e-results/results.json ]; then
            node -e "const r=require('./arista-webui/e2e-results/results.json').stats||{};console.log('results.json stats:', JSON.stringify({expected:r.expected,unexpected:r.unexpected,skipped:r.skipped,flaky:r.flaky}))" || echo 'results.json unreadable — the assert step below prints the reason'
          else
            echo 'arista-webui/e2e-results/results.json absent — Playwright never reported'
          fi
        shell: bash

      - name: Assert the specs actually EXECUTED + scan every artifact for secrets
        id: assert
        if: ${{ always() }}
        # Playwright's own exit code cannot carry the skip story (and the harness's `--quiet` rule
        # means nothing credential-shaped may live in anything this job keeps): assert-e2e-run
        # demands expected >= 1, unexpected = 0, flaky = 0, SKIPPED = 0 in results.json, then runs
        # the F8 secret scan over every text artifact (--check-secrets). A skip here means the lane
        # broke (in a real-cEOS run a skip is a bug, not coverage) — same rule assert-live-run enforces.
        run: node scripts/assert-e2e-run.mjs arista-webui/e2e-results/results.json --check-secrets

      - name: Upload the redacted e2e diagnostics
        if: ${{ always() && steps.assert.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ceos-e2e-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.E2E_LOG }}
            arista-webui/e2e-results/**
          if-no-files-found: error
          retention-days: 14
