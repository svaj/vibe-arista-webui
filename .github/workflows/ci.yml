name: CI

# Offline quality gate only (#2 / M0). This workflow must never start, build or contact an
# EOS device or a cEOS-lab container: no `arista_eos` image, no docker, no eAPI endpoint.
# Real-EOS / cEOS lanes are M12 (#14) work and, when added, must be a separate explicitly
# trusted `workflow_dispatch` job on a dedicated runner per docs/CEOS.md — never a PR job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck / lint / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # PLAN.md M0 asked for a Node 20/22 matrix. The repo's existing toolchain forbids 20:
      #   vitest 5.0.5 engines: "^22.12.0 || ^24.0.0 || >=26.0.0"
      #   jsdom 30.1.3  engines: "^22.22.2 || ^24.15.0 || >=26.0.0" (its undici@8 needs node >=22.19)
      # so a node-20 job dies inside `vitest run` for arista-webui (undici decompress.js:
      # "Cannot read properties of undefined (reading 'bind')"), not because of this package.
      # 22 + 24 are the two LTS lines every pinned tool supports. The library's own
      # `engines.node >= 20` (DR-021) is a runtime floor claim, not a dev-toolchain claim:
      # prove it in M12 (#14) by running the built dist/ under Node 20 with a dependency-free
      # smoke script rather than by running the dev tooling there.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (lockfile at the workspace root)
        run: npm ci

      # Order deliberately mirrors the local exit gate from PLAN.md M0.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (offline only — never a device)
        run: npm test

      # The v8 coverage gate. `arista-api-client/vitest.config.ts` carries the global floor
      # (lines 85 / branches 75 / functions 60) plus the per-directory thresholds, and the
      # command's EXIT CODE is the assertion — a threshold miss fails this step. Still fully
      # offline: the `unit` project excludes every `*.live.test.ts`, nothing here can reach a
      # device or Docker. Cheaper than it looks (~6 s of wall time), so it gates both legs;
      # only the node-22 leg publishes the report, so there is one artifact to review.
      - name: Coverage gate (offline unit suite)
        run: npm run coverage -w arista-api-client

      - name: Build
        run: npm run build

      # Uploaded with !cancelled() so a threshold failure still ships the report the reviewer
      # needs to see WHAT was uncovered — the step's own failure above is the gate.
      - name: Upload coverage report (node 22 leg only)
        if: ${{ matrix.node == '22' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-client-coverage-node${{ matrix.node }}
          path: arista-api-client/coverage/
          if-no-files-found: error
          retention-days: 14
